# One origin for the browser: static dashboard plus the API, MCP and live-event WebSocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen ${NGINX_PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Re-resolve the API service name through Docker's DNS: a recreated api container gets a new
    # address, and a proxy_pass with a literal host would keep the one resolved at startup (502s).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream ${API_UPSTREAM};
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location /mcp/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location /health/ {
        proxy_pass $api_upstream;
    }
    location /openapi.json {
        proxy_pass $api_upstream;
    }
    location /docs {
        proxy_pass $api_upstream;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
